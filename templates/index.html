<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chat Assistant</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>

<body>

    <div class="container">

        <div class="row">

            <!-- Heading -->
            <div class="col-12 mt-4">

                <h1 class="text-center">
                    AI Chat Assistant
                </h1>

                <p class="text-center" style="font-size:20px;">
                    Your personal AI assistant powered by
                    <strong>Ollama (Llama 3)</strong>,
                    <strong>Flask</strong>,
                    and
                    <strong>gTTS</strong>.
                </p>

            </div>

            <!-- Instructions -->
            <div class="col-12">

                <p class="text-center mb-4">
                    Type your question below. Tap the speaker icon on a reply to hear it.
                </p>

            </div>

            <!-- Dark Mode Switch -->
            <div class="col-12 text-center">

                <div class="custom-control custom-switch mb-4 d-inline-block">

                    <input
                        type="checkbox"
                        class="custom-control-input"
                        id="light-dark-mode-switch">

                    <label
                        class="custom-control-label"
                        for="light-dark-mode-switch">

                        Toggle Light / Dark Mode

                    </label>

                </div>

            </div>

            <!-- Chat Window -->
            <div class="col-12 col-md-8 mx-auto mb-4">

                <div id="chat-window" class="p-3">

                    <div id="message-list"></div>

                    <!-- Bot Loading -->
                    <div class="loading-animation">

                        <div class="loading-dots">

                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>

                        </div>

                    </div>

                </div>

                <!-- Input -->
                <div class="input-group mt-3">

                    <input
                        type="text"
                        id="message-input"
                        class="form-control"
                        placeholder="Type your message here...">

                    <div class="input-group-append">

                        <button
                            id="send-button"
                            class="btn btn-primary send">

                            <i class="fa fa-paper-plane"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
